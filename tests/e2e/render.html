<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colonia render check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<!--
  Render showcase used by tests/e2e/screenshots.mjs (and handy for artists):
  builds the demo city headlessly, fast-forwards, then draws one frame.
  Query params: scenario=c1  months=6  zoom=2  overlay=none  level=2  w=1280 h=800
                military=1 (garrison + raid)  raiders=12  recruitDays=70  focus=x,y
                trade=1 (dock + sea routes; waits for a docked ship)  shipState=toDock
                select=well (click the nearest well)  place=fountain (placement preview)
                time=0.8 (time of day 0..1: 0.3 noon, 0.67 sunset, 0.8 night)
                month=9 (season: 0 Ianuarius .. 11 December)  weather=rain|storm|snow|cloudy
                look=market (center on the nearest building of that type or kind)
                busy=1 (stock markets and book shows, to see shoppers and crowds)
-->
<canvas id="c"></canvas>
<script type="module">
  import { Game } from '../../src/core/game.js';
  import { SCENARIOS, sandboxScenario } from '../../src/data/scenarios.js';
  import { buildDemoCity, buildDemoGarrison } from '../../src/dev/demoCity.js';
  import { Renderer } from '../../src/render/renderer.js';
  import { launchInvasion } from '../../src/sim/military.js';
  import { buildDemoHarbor } from '../../src/dev/demoCity.js';
  import { planAction } from '../../src/sim/construction.js';

  const q = new URLSearchParams(location.search);
  const scen = q.get('scenario') === 'sandbox' ? sandboxScenario({ size: 64, type: q.get('maptype') || 'river', seed: q.get('seed') || 'demo' }) : (SCENARIOS.find((s) => s.id === (q.get('scenario') || 'c1')) || SCENARIOS[0]);
  const game = new Game({ scenario: scen, flags: { unlockall: true, money: 50000 } });
  const res = buildDemoCity(game, { level: Number(q.get('level') || 2) });
  const months = Number(q.get('months') || 6);
  const t0 = performance.now();
  game.runDays(months * 16);
  // military=1: add a garrison, let it recruit, then start a raid and stop
  // when the first soldiers and raiders are fighting.
  let focus = res.center;
  let battle = null;
  if (q.get('military') && res.center) {
    const gar = buildDemoGarrison(game, res.center, { stock: true, militaryFirst: true });
    game.runDays(Number(q.get('recruitDays') || 70));
    launchInvasion(game, null, Number(q.get('raiders') || 12));
    for (let d = 0; d < 90; d++) {
      game.runTicks(10);
      const fighting = [...game.units.values()].filter((u) => u.state === 'engage' || u.state === 'fight');
      if (fighting.length >= 6) {
        let sx = 0, sy = 0;
        for (const u of fighting) { sx += u.x; sy += u.y; }
        focus = { x: Math.floor(sx / fighting.length), y: Math.floor(sy / fighting.length) };
        game.runTicks(Number(q.get('extraTicks') || 30));
        break;
      }
    }
    battle = { forts: gar.forts.length, walls: gar.wall, units: game.units.size, projectiles: game.projectiles.length };
  }
  // trade=1: a dock + warehouse by the water, sea routes open; stop when a ship is in view.
  let harbor = null;
  if (q.get('trade') && res.center) {
    harbor = buildDemoHarbor(game, res.center);
    if (harbor.dock) {
      focus = { x: harbor.dock.x + 1, y: harbor.dock.y + 1 };
      for (let d = 0; d < 200; d++) {
        game.runTicks(20);
        const ship = [...game.walkers.values()].find((w) => w.type === 'ship' && (w.state === q.get('shipState') || (!q.get('shipState') && w.state === 'docked')));
        if (ship) { harbor.ship = { x: ship.x, y: ship.y, state: ship.state }; break; }
      }
      harbor = { dock: { x: harbor.dock.x, y: harbor.dock.y, side: harbor.dock.waterSide }, ship: harbor.ship, routes: harbor.routes };
    }
  }
  const simMs = performance.now() - t0;
  const W = Number(q.get('w') || 1280), H = Number(q.get('h') || 800);
  const r = new Renderer(document.getElementById('c'));
  r.attach(game);
  r.camera.zoomIndex = Number(q.get('zoom') ?? 2);
  r.resize(W, H, 1);
  if (q.get('focus')) { const [fx, fy] = q.get('focus').split(',').map(Number); focus = { x: fx, y: fy }; }
  // select=<kind>: click the building of that kind nearest the view center.
  let selected = null;
  if (q.get('select') && focus) {
    let best = null;
    for (const b of game.buildings.values()) {
      if (b.def.kind !== q.get('select')) continue;
      const d = Math.hypot(b.x - focus.x, b.y - focus.y);
      if (!best || d < best.d) best = { b, d };
    }
    if (best) { selected = best.b; focus = { x: best.b.x, y: best.b.y }; }
  }
  // busy=1: stock every market and book shows at every venue (to see shoppers and crowds).
  if (q.get('busy')) {
    for (const b of game.buildings.values()) {
      if (b.def.kind === 'market' && b.stock) for (const key in b.stock) b.stock[key] = 200;
      if (b.shows) for (const key in b.shows) b.shows[key] = 20;
    }
  }
  // look=<type or kind>: center on the nearest such building (no selection outline).
  if (q.get('look') && focus) {
    let best = null;
    for (const b of game.buildings.values()) {
      if (b.type !== q.get('look') && b.def.kind !== q.get('look')) continue;
      const d = Math.hypot(b.x - focus.x, b.y - focus.y);
      if (!best || d < best.d) best = { b, d };
    }
    if (best) focus = { x: best.b.x + Math.floor(best.b.size / 2), y: best.b.y + Math.floor(best.b.size / 2) };
  }
  // place=<tool>: preview placing that building on the nearest valid tile.
  let placing = null;
  if (q.get('place') && focus) {
    const tool = q.get('place');
    let best = null;
    for (let y = 1; y < game.map.h - 1; y++) {
      for (let x = 1; x < game.map.w - 1; x++) {
        const d = Math.hypot(x - focus.x - 3, y - focus.y);
        if (best && d >= best.d) continue;
        const plan = planAction(game, tool, x, y, x, y);
        if (plan.count) best = { x, y, d, plan };
      }
    }
    if (best) { placing = best.plan; focus = { x: best.x, y: best.y }; }
  }
  if (focus) r.camera.centerOnTile(focus.x, focus.y);
  r.setOverlay(q.get('overlay') || 'none');
  if (selected) r.selectedId = selected.id;
  // cloud=1: park one cloud shadow in the middle of the view (to judge its look).
  if (q.get('cloud') && focus && r.ambient.clouds.length) {
    const c = r.ambient.clouds[0];
    c.x = (focus.x - focus.y) * 32 + 120;
    c.y = (focus.x + focus.y) * 16 - 40;
  }
  if (placing) { r.plan = placing; r.tool = placing.tool; }
  // The world around the city: fixed time of day, season and weather.
  if (q.get('month') !== null) game.time.month = Number(q.get('month'));
  r.fixedTime = q.get('time') !== null ? Number(q.get('time')) : 0.3;
  if (q.get('weather')) r.weather.force(q.get('weather'), true);
  else r.weather.force('clear', true);
  r.weather.update = () => {}; // keep it as set for the picture
  r.render(0, 0.016);
  r.render(0.5, 0.016);
  window.__result = { ok: res.ok, reason: res.reason, farms: res.farms, battle, harbor, focus, coverage: r.stats.coverage, simMs, renderMs: r.stats.ms, objects: r.stats.objects, pop: game.city.population, buildings: game.buildings.size, walkers: game.walkers.size, tiers: game.city.tierCounts };
  window.__done = true;
</script>
</body>
</html>
