<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colonia art sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #6f9644; font: 12px/1.3 system-ui, sans-serif; color: #1d1a14; }
  h2 { margin: 14px 12px 4px; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px; }
  figure { margin: 0; background: rgba(255,255,255,0.18); border-radius: 6px; padding: 4px; text-align: center; }
  figcaption { font-size: 11px; }
  canvas { display: block; }
</style>
</head>
<body>
<!--
  Art sheet: every home level in all 8 looks (and 2x2 blocks of single-tile
  homes), plus buildings with live details, and carts with every good,
  drawn straight from the procedural art (no game running). Handy for artists
  reviewing changes, and as a side-by-side reference when making replacement
  sprites. Query params: scale=2 (pixel scale, default 2)  tiers=1,2,3 (levels subset)  extras=1 (with tiers: the other sections too)  carts=1 (the carts only; scale=1 is the default zoom)
  water=1 (fishing and races only: shipyard, wharf, boats, the hippodrome, chariots)
  cloth=1 (the cloth industry only: the flax farm as it grows and rests, the two workshops, the carts)
  Served by: npm run serve, then open /tests/e2e/artsheet.html
-->
<div id="sheet"></div>
<script type="module">
  import { buildingSpec } from '../../src/render/buildingArt.js';
  import { HOUSE_TIERS } from '../../src/data/housing.js';
  import { drawWalker, drawChariot } from '../../src/render/walkerArt.js';
  import { drawGulls } from '../../src/render/waterArt.js';
  import { LED_GOODS } from '../../src/render/cargoArt.js';
  import { GOOD_KEYS } from '../../src/data/goods.js';
  import { BUILDINGS } from '../../src/data/buildings.js';

  const q = new URLSearchParams(location.search);
  const scale = Number(q.get('scale') || 2);
  // carts=1 shows only the carts (an empty tier list skips every home level)
  const water = !!q.get('water');
  const cloth = !!q.get('cloth');
  const only = q.get('carts') || water || cloth ? [] : q.get('tiers') ? q.get('tiers').split(',').map(Number) : null;
  const sheet = document.getElementById('sheet');

  /** Draw one sprite spec into a new canvas at `scale`. */
  function render(spec) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(spec.w * scale);
    c.height = Math.ceil(spec.h * scale);
    const ctx = c.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, spec.ax * scale, spec.ay * scale);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    spec.draw(ctx);
    return c;
  }

  function section(title, cells) {
    const h = document.createElement('h2');
    h.textContent = title;
    const row = document.createElement('div');
    row.className = 'row';
    for (const [label, spec] of cells) {
      const fig = document.createElement('figure');
      fig.appendChild(render(spec));
      const cap = document.createElement('figcaption');
      cap.textContent = label;
      fig.appendChild(cap);
      row.appendChild(fig);
    }
    sheet.append(h, row);
  }

  for (let tier = 1; tier < HOUSE_TIERS.length; tier++) {
    if (only && !only.includes(tier)) continue;
    const S = HOUSE_TIERS[tier].size;
    const cells = [];
    for (let v = 0; v < 8; v++) cells.push([`look ${v}`, buildingSpec('house', S, v, tier)]);
    section(`Level ${tier}: ${HOUSE_TIERS[tier].name} (${S}x${S})`, cells);
  }
  if (!only || q.get('extras')) {
    // Four single-tile homes of one level that joined into a 2x2 block.
    section('Blocks: four single-tile homes joined into one 2x2 home', [1, 4, 7, 10].map((t) => [`${HOUSE_TIERS[t].name}`, buildingSpec('house', 2, t, t)]));
    // Every god's temple, in the gods' order (data/gods.js), the statues and
    // the mines.
    section('Temples', ['ceres', 'neptune', 'mercury', 'mars', 'venus'].map((g) => [g, buildingSpec(`temple_${g}`, 2, 0, 0)]));
    section('Statues and mines', [['statue_small', 1], ['statue_medium', 2], ['statue_large', 3], ['iron_mine', 2], ['marble_quarry', 2]].map(([k, S]) => [k, buildingSpec(k, S, 0, 0)]));
    section('Buildings with flags (still pictures get painted cloth)', ['prefecture', 'forum', 'senate', 'barracks', 'fort_legion', 'colosseum'].map((t) => {
      const S = { prefecture: 1, forum: 2, senate: 4, barracks: 3, fort_legion: 3, colosseum: 5 }[t];
      return [t, buildingSpec(t, S, 0, 0)];
    }));
  }
  if (!only || q.get('extras') || cloth) {
    // The cloth industry: the flax field at each growth stage (blue from the
    // third), resting for an Insane winter, and the two workshops in their looks.
    section('Flax Farm: growth stages 0 to 4, then resting in winter (Insane)', [0, 1, 2, 3, 4, 7].map((st) => [st >= 5 ? `resting ${st - 5}` : `stage ${st}`, buildingSpec('farm_flax', 3, 0, st)]));
    section('Linen Maker (loom) and Clothing Maker (tunics drying), in their looks', [
      ...[0, 1].map((v) => [`linen_ws ${v}`, buildingSpec('linen_ws', 2, v, 0)]),
      ...[0, 1, 2, 3].map((v) => [`clothing_ws ${v}`, buildingSpec('clothing_ws', 2, v, 0)]),
    ]);
  }
  if (!only || q.get('extras') || water) {
    // Fishing: the shipyard turned to each side of the water (empty slip,
    // ribs, planked hull), the wharf with and without the catch waiting.
    // Water drawn under each so the side facing it shows.
    const onWater = (spec, side, S) => ({ ...spec, draw(ctx) {
      const pts = [[S, 0, S + 0.9, S], [0, S, S, S + 0.9], [-0.9, 0, 0, S], [0, -0.9, S, 0]];
      const [u0, v0, u1, v1] = [pts[3], pts[0], pts[1], pts[2]][side];
      const P = (u, v) => [(u - v) * 32, (u + v) * 16];
      ctx.fillStyle = '#4a90c8';
      ctx.beginPath();
      for (const [u, v] of [[u0, v0], [u1, v0], [u1, v1], [u0, v1]]) ctx.lineTo(...P(u, v));
      ctx.fill();
      spec.draw(ctx);
    } });
    const wide = (spec) => ({ ...spec, w: spec.w + 70, h: spec.h + 34, ax: spec.ax + 35 });
    section('Shipyard: the water on each side; empty slip, ribs, planked hull', [0, 1, 2, 3].flatMap((side) => [0, 1, 2].map((stage) => [`side ${side}, hull ${stage}`, wide(onWater(buildingSpec('shipyard', 2, 0, side + 4 * stage), side, 2))])));
    section('Fishing wharf: the water on each side; catch waiting', [0, 1, 2, 3].flatMap((side) => [0, 1].map((fish) => [`side ${side}${fish ? ', catch' : ''}`, wide(onWater(buildingSpec('wharf', 2, 0, side + 4 * fish), side, 2))])));
    // The hippodrome: its three sections drawn in place, as one.
    const hip = [0, 1, 2].map((s) => buildingSpec(s ? 'hippodrome_part' : 'hippodrome', 5, 0, s));
    section('Hippodrome (three 5x5 sections) and the chariot maker', [
      ['hippodrome', { w: hip[0].w + 2 * 160, h: hip[0].h + 2 * 80, ax: hip[0].ax, ay: hip[0].ay, draw(ctx) {
        hip.forEach((spec, s) => { ctx.save(); ctx.translate(s * 160, s * 80); spec.draw(ctx); ctx.restore(); });
      } }],
      ['chariot_maker', buildingSpec('chariot_maker', 3, 0, 0)],
    ]);
    const boatSpec = (state) => ({ w: 70, h: 44, ax: 35, ay: 34, draw(ctx) {
      ctx.fillStyle = '#4a90c8';
      ctx.fillRect(-35, -34, 70, 44);
      drawWalker(ctx, { id: 4, type: 'fishing_boat', anim: 0, moving: state !== 'fishing', state }, 0, 0, 1, 0.4, state === 'homeWithCatch' ? -1 : 1, 0, 0);
    } });
    section('Fishing boats: sailing out, fishing, coming home with the catch, moored; gulls over a ground', [
      ['out', boatSpec('toGround')], ['fishing', boatSpec('fishing')], ['home', boatSpec('homeWithCatch')], ['moored', boatSpec('moored')],
      ['gulls', { w: 90, h: 60, ax: 45, ay: 44, draw(ctx) { ctx.fillStyle = '#4a90c8'; ctx.fillRect(-45, -44, 90, 60); drawGulls(ctx, 0, 6, 1, 0.7, 1); } }],
    ]);
    const chariot = (face, color, label) => [label, { w: 60, h: 34, ax: face > 0 ? 18 : 42, ay: 28, draw(ctx) { drawChariot(ctx, 0, 0, 1, face, 0.6, color, 1); } }];
    section('Chariots: the charioteer (blue), a team on its way to the races, both ways', [
      chariot(1, '#2f6db5', 'charioteer'), chariot(-1, '#2f6db5', 'facing left'), chariot(1, '#b8573a', 'team'),
    ]);
  }
  if ((!only || q.get('extras') || q.get('carts') || cloth) && !water) {
    // Carts: every good at a part load (100 of a hand cart's 200) and a full
    // load, facing right then left; farm wagons at 100 and 400; horses led;
    // caravan mules coming in (bales) and going out with what they bought.
    // Drawn with the game's own walker art at `scale` (1 = the default zoom).
    const pusher = (good, amount, extra = {}) => ({ id: 3, type: 'cart', anim: 0, moving: true, cargo: amount ? { good, amount } : null, ...extra });
    // Each walker gets a slot `step` px wide; `back` is how far his feet stand
    // from the slot's back edge (room for what trails behind him: horses).
    const walkers = (title, cells, step = 36, back = 6) => {
      const h = document.createElement('h2');
      h.textContent = title;
      const row = document.createElement('div');
      row.className = 'row';
      for (const [label, list] of cells) {
        const fig = document.createElement('figure');
        const c = document.createElement('canvas');
        c.width = Math.ceil(list.length * step * scale);
        c.height = Math.ceil(28 * scale);
        const ctx = c.getContext('2d');
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        list.forEach(([w, face, origin], i) => {
          const x = (i * step + (face > 0 ? back : step - back)) * scale;
          drawWalker(ctx, w, x, 25 * scale, scale, 0, face, 0, 0.3, origin);
        });
        fig.appendChild(c);
        const cap = document.createElement('figcaption');
        cap.textContent = label;
        fig.appendChild(cap);
        row.appendChild(fig);
      }
      sheet.append(h, row);
    };
    const shop = BUILDINGS.pottery_ws; // a workshop's cart holds CART_LOAD
    const carted = GOOD_KEYS.filter((g) => !LED_GOODS.includes(g));
    walkers(`Carts: half load and full, both ways (scale ${scale})`, carted.map((g) => [g, [
      [pusher(g, 100), 1, shop], [pusher(g, 200), 1, shop], [pusher(g, 200), -1, shop],
    ]]).concat([
      ['empty', [[pusher(null, 0), 1, shop], [pusher(null, 0), -1, shop]]],
      ['warehouse lot (full)', [[pusher('iron', 100), 1, BUILDINGS.warehouse]]],
      ['unknown good', [[pusher('silk', 200), 1, shop]]],
    ]));
    walkers('Farm wagons: 100, 200, 300, 400', ['wheat', 'vegetables', 'fruit', 'meat', 'olives', 'grapes', 'flax'].map((g) => [g,
      [100, 200, 300, 400].map((n) => [pusher(g, n), 1, BUILDINGS.farm_wheat])])
      .concat([['empty wagon', [[pusher(null, 0), 1, BUILDINGS.farm_wheat], [pusher(null, 0), -1, BUILDINGS.farm_wheat]]]]), 46);
    walkers('Horses led: 1 to 4, and facing left', [
      ['horses', [1, 2, 3, 4].map((n) => [pusher('horses', n * 100), 1, BUILDINGS.horse_ranch])],
      ['horses, left', [[pusher('horses', 400), -1, BUILDINGS.horse_ranch]]],
      ['going home', [[pusher(null, 0), 1, BUILDINGS.horse_ranch]]],
    ], 44, 38);
    const caravan = (packs) => ({ id: 5, type: 'caravan', anim: 0, moving: true, packs });
    walkers('Caravans: coming in (bales), leaving with what they bought', [
      ['in', [[caravan(undefined), 1]]],
      ['wine + oil', [[caravan(['wine', 'oil']), 1]]],
      ['marble', [[caravan(['marble']), -1]]],
      ['wheat + timber', [[caravan(['wheat', 'timber']), 1]]],
      ['bought nothing', [[caravan([]), 1]]],
    ], 30);
  }
  window.__done = true;
</script>
</body>
</html>
