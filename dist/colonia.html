  padding: 6px 8px;
  border-radius: 6px;
  pointer-events: none;
  white-space: pre;
}
#console {
  position: absolute;
  left: 0;
  right: var(--sidebar-w);
  top: var(--top-h);
  height: 40%;
  background: rgba(10, 10, 10, 0.92);
  color: #d8f5d8;
  font: 13px/1.4 ui-monospace, Consolas, monospace;
  z-index: 45;
  display: flex;
  flex-direction: column;
  border-bottom: 2px solid var(--bronze);
}
#console .out { flex: 1; overflow-y: auto; padding: 8px 10px; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
#console input { border: none; border-top: 1px solid #333; background: #111; color: #fff; padding: 8px 10px; outline: none; font: inherit; }
#overlay-legend {
  position: absolute;
  right: calc(var(--sidebar-w) + 10px);
  bottom: 10px;
  z-index: 20;
  background: var(--panel);
  border: 1px solid var(--bronze);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1.5;
  pointer-events: none;
}
#overlay-legend .legend-row { display: flex; align-items: center; gap: 6px; }
#overlay-legend .legend-row i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.trend-head { display: flex; justify-content: space-between; font-size: 12.5px; }
.trend-range { font-size: 11px; }
canvas.trend { display: block; margin: 2px 0; }
#tooltip {
  position: fixed;
  z-index: 60;
  max-width: 280px;
  background: var(--hud);
  color: var(--hud-ink);
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 12.5px;
  pointer-events: none;
  box-shadow: var(--shadow);
  border: 1px solid var(--bronze);
}
#tooltip.warn {
  border: 2px solid var(--bad);
  background: color-mix(in srgb, var(--bad) 22%, var(--hud));
  font-weight: 600;
}
#crash {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(15, 10, 8, 0.92);
  color: #f5e9d8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#crash .box { max-width: 720px; width: 100%; background: #2a211a; border: 2px solid #b3261e; border-radius: 10px; padding: 16px; }
#crash pre { max-height: 40vh; overflow: auto; background: #140f0b; padding: 10px; border-radius: 6px; font-size: 12px; user-select: text; -webkit-user-select: text; white-space: pre-wrap; }
.empire-modal { width: min(1180px, 100%); max-height: min(94vh, 100%); }
.empire-body { display: flex; gap: 14px; align-items: flex-start; scrollbar-gutter: stable; }
.empire-main { flex: 1 1 auto; min-width: 0; }
.empire-map-wrap { width: 100%; display: flex; justify-content: center; }
.empire-full { display: block; border-radius: 4px; cursor: pointer; touch-action: manipulation; }
.empire-readout { margin-top: 6px; min-height: 2.6em; font-size: 13px; }
.empire-side { flex: 0 0 300px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.empire-section h4 { margin: 0 0 4px; }
.empire-row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; font-size: 13px; border-radius: 4px; }
.empire-row.link { cursor: pointer; width: 100%; border: none; background: none; text-align: left; }
.empire-row.link:hover, .empire-row.sel { background: var(--panel-3); }
.empire-glyph { flex: none; display: inline-flex; }
.empire-glyph canvas { border-radius: 3px; }
.empire-legend .empire-row { font-size: 12px; color: var(--ink-soft); }
@media (max-width: 760px) {
  :root { --sidebar-w: 0px; --top-h: 42px; }
  #hud-top { right: 0; }
  #sidebar {
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    height: auto;
    max-height: 46vh;
    border-left: none;
    border-top: 3px solid var(--bronze);
  }
  #minimap-wrap { display: none; }
  #categories { grid-template-columns: repeat(7, 1fr); }
  .cat-btn { aspect-ratio: auto; height: 38px; }
  #build-list { max-height: 22vh; }
  #build-list.collapsed { display: none; }
  #tool-info { height: auto; min-height: 0; max-height: 72px; }
  #info-panel { left: 8px; right: 8px; width: auto; top: calc(var(--top-h) + 6px); max-height: 50vh; }
  #messages { bottom: auto; top: calc(var(--top-h) + 6px); width: calc(100% - 16px); left: 8px; }
  #overlay-legend { display: none; } 
  .hud-title { display: none; }
  .grid2 { grid-template-columns: 1fr; }
  .tabs.advisor-tabs { padding: 4px 6px 0; gap: 0; }
  .advisor-tabs .tab { padding: 5px 5px; font-size: 12.5px; }
  .empire-body { flex-direction: column; align-items: stretch; }
  .empire-side { flex: none; }
  #console { right: 0; }
}

seed:"novum-castrum"},funds:6e3,startYear:-280,goals:{population:300,culture:15,prosperity:0,peace:35,favor:0},paceYears:1.25,rank:0,unlocks:e0,partners:[],requests:!1,crime:!1,disease:!1,majorWrath:!1,hints:["Mark housing plots (Area) next to the Imperial road, or any road (Via) joined to it. Settlers arrive from the map edge.","Place a Puteus (Well) within 2 tiles of homes so tents can become Family Tents.","A Seges (Wheat Farm) on meadow, the yellow-green land, feeds a Granarium (Granary); a Macellum (Market) sends vendors to sell food to homes.","An Excubitorium (Prefecture) and a Collegium Fabrum (Engineer's Post) keep fires and collapses away. Put them near your homes.","The Forum sends tax collectors. Homes they have not visited pay nothing!",`Culture here comes from the temples: every home a priest visits counts. Peace grows a point a month while the city is content (a mood of ${g.PEACE_MOOD} or more): fed, housed, at work and not overtaxed.`,"Click any building for details. Homes tell you exactly what they need to grow.",`This land gives little work: a town of about 300 people fills its jobs. More homes than that only add idle hands, and above ${g.UNEMPLOYMENT_MOOD_FREE*100}% unemployment the mood falls and peace stops growing. The Labor advisor shows how many are out of work.`]},{id:"c2",step:2,name:"Aquae Clarae",title:"Clear Waters",intro:"A lakeside town needs clean water and a little culture. Build reservoirs by the lakes, run aqueducts, and give citizens fountains, schools and a stage.",map:{size:96,type:"lakes",seed:"aquae-clarae"},funds:7e3,startYear:-270,goals:{population:450,culture:35,prosperity:20,peace:45,favor:0},paceYears:2.1,rank:1,unlocks:t0,partners:[],requests:!1,crime:!1,disease:!1,majorWrath:!1,hints:["A Castellum Aquae (Reservoir) placed next to water fills up. A Lacus (Fountain) inside its piped area (10 tiles) supplies homes within 4 tiles.","An Aquaeductus (Aqueduct) connects a full reservoir to other reservoirs farther inland.","Cottages need a fountain; above them homes want entertainment, then a school. A Theatrum (Theater) needs actors: build a Grex (Actor Troupe) nearby.","Prosperity grows with better homes, a profit, work for everyone and fair wages.","Work is still scarce here: about 450 people fill the jobs a sensible town has. Build homes for the people your buildings can employ, not more."]},{id:"c3",step:3,track:"peaceful",name:"Figlina",title:"Clay and Commerce",intro:"The plains of Figlina are rich in clay. Build an industry, fill warehouses and open your first trade route. Prosperity is now expected of you.",map:{size:112,type:"plains",seed:"figlina"},funds:7e3,startYear:-255,goals:{population:3500,culture:45,prosperity:30,peace:50,favor:0},paceYears:3.6,rank:2,unlocks:vc,partners:["tarraco","aquileia"],requests:!0,hints:["A Cretifodina (Clay Pit) must be near water. A Figlina (Potter) turns clay into pottery, which Merchant Houses and every home above them need, with Balneae (Baths) nearby.","A Horreum (Warehouse) stores goods. Caravans only trade with warehouses.","Open trade routes in the Trade advisor, then mark goods for import or export.","Trade is work: what your partners buy keeps farms, clay pits and potters staffed. Let the town grow as its jobs do.","A Domus wants more shows than a theater gives: add an Amphitheatrum (Amphitheater), with gladiators from a Ludus Gladiatorius (Gladiator School), and actors too for its best shows."]},{id:"c3m",step:3,track:"military",name:"Firmum",title:"The Picene Frontier",intro:"Rome planted the Latin colony of Firmum on a hilltop above the Picene country in 264 BC, once the Picenes were beaten, and the tribes in the valleys have not forgotten the war. Dig iron from the hills, arm a legion and hold the town: whoever holds Firmum holds the road along the Adriatic.",map:{size:112,type:"lakes",seed:"firmum-picenum"},funds:7e3,startYear:-255,goals:{population:1100,culture:35,prosperity:20,peace:48,favor:0},paceYears:2.3,rank:2,unlocks:D5,partners:["aquileia","capua"],requests:!0,military:{first:24,interval:[16,24],base:3},distantBattles:[{year:2,city:"ariminum",enemy:12}],hints:["Raiders come down from the hills within two years. A Ferraria (Iron Mine) by the rocks and a Fabrica (Weaponsmith) arm the legionaries a Tirocinium (Barracks) trains for a Castra (Legion Fort).","Word of a raid comes about six months before it and scouts report its size and road three months before, and the Empire map shows the warband and the edge it will come in by. Build Turres (Towers) and a Murus (Wall) across that way in.","A Campus (Military Academy) trains your legionaries to fight harder.","Capua buys iron: what the mine digs beyond the weaponsmith's needs is trade, and work.","A Domus wants more shows than a theater gives: add an Amphitheatrum (Amphitheater), with gladiators from a Ludus Gladiatorius (Gladiator School)."]},{id:"c4",step:4,track:"military",name:"Pons Aelius",title:"The River Crossing",intro:"A great river divides this province. Bridge it, harvest its forests and olive groves, and entertain a growing people with gladiatorial games.",map:{size:128,type:"river",seed:"pons-aelius"},funds:8e3,startYear:-240,goals:{population:5e3,culture:50,prosperity:40,peace:55,favor:0},paceYears:5.7,rank:3,unlocks:Ju,partners:["tarraco","massilia","lugdunum"],requests:!0,military:{first:60,interval:[30,40],base:4},distantBattles:[{year:3,city:"placentia",enemy:16}],hints:["A Pons (Bridge) must start and end on land and run straight across water.","Massilia trades by sea: build an Emporium (Trade Dock) on the river bank. Tarraco and Lugdunum send caravans along the Imperial road.","Apartment Houses need furniture (an Officina Lignaria, the carpenter, from timber); Tenements, the first big homes, also need oil, a barber, and both a school and a library.","Insulae also need clothing: a Linarium (Flax Field) on meadow, a Textrinum (Linen Weaver) and a Taberna Vestiaria (Clothing Maker), or linen bought from Tarraco for the Taberna Vestiaria.","Raiders roam these hills. A Tirocinium (Barracks) trains soldiers for your forts: legionaries need weapons (Fabrica, the weaponsmith), archers need arrows (Officina Sagittaria, the fletcher, from timber and iron)."]},{id:"c4p",step:4,track:"peaceful",name:"Paestum",title:"City of Temples",intro:"The Greeks of Poseidonia raised great temples on this shore long before Rome made their city the Latin colony of Paestum in 273 BC. Keep the gods content, fill the harbor with ships from Massilia and Corinthus, and make Paestum a city the Greeks would envy. No enemy threatens this shore: Rome will judge you by what you build.",map:{size:128,type:"coast",seed:"paestum"},funds:8e3,startYear:-240,goals:{population:2700,culture:60,prosperity:50,peace:65,favor:40},paceYears:3.75,rank:3,unlocks:Qu(Ju),partners:["capua","massilia","corinthus"],requests:!0,hints:["No raiders come to Paestum, and you may build no forts. Rome watches your favor instead: meet Caesar's requests and send gifts, for if his favor runs out his legions come, and there is no army here to meet them.","Culture is the measure of this city: a Templum (Grand Temple) counts as two temples to its god, and schools, a Bibliotheca (Library) and shows add the rest.","Corinthus sells marble and oil by sea and buys wheat, iron and clothing. Build an Emporium (Trade Dock) on the shore.","Apartment Houses need furniture (an Officina Lignaria, the carpenter, from timber); Tenements also need oil, a barber, and both a school and a library; Insulae need clothing too."]},{id:"c5",step:5,track:"military",name:"Portus Mercatorum",title:"Merchant Shore",intro:"A coastal province with iron in its hills and vines on its slopes. Grow a wealthy city worthy of villas, and keep the Emperor happy.",map:{size:128,type:"coast",seed:"portus-mercatorum"},funds:9e3,startYear:-225,goals:{population:6500,culture:60,prosperity:50,peace:60,favor:55},paceYears:7.8,rank:4,unlocks:bc,partners:["massilia","lugdunum","carthago"," rium and the Trade advisor say when ships are waiting offshore for a free one). Desert and plains provinces often have no sea access.")),p("p",{},"The Empire map (E, or the compass in the top bar) shows your province, Rome and every partner with its route. Caravans and ships on their way move along their routes in their city's color; point at one (or tap it) for the days until it arrives. Click a city for what it buys and sells, and to open its route. The game keeps running while it is open."),p("p",{},"Prices per 100 units:"),p("table",{class:"tbl"},p("tr",{},p("th",{},"Good"),p("th",{class:"r"},"Import cost"),p("th",{class:"r"},"Export price")),Object.entries(U).map(([,t])=>p("tr",{},p("td",{},`${t.icon} ${t.name}`),p("td",{class:"r num"},t.buy),p("td",{class:"r num"},t.sell))))];case"services":{let t=o=>{let n=H[o];return p("tr",{},p("td",{},p("b",{},n.name),n.en!==n.name?p("div",{class:"muted"},n.en):null),p("td",{style:{fontSize:"12.5px"}},n.desc))};return[p("table",{class:"tbl"},["well","fountain","reservoir","prefecture","engineer_post","market","granary","warehouse","dock","shipyard","wharf","temple_ceres","temple_large_ceres","school","library","academy","theater","actor_troupe","amphitheater","gladiator_school","colosseum","menagerie","hippodrome","chariot_maker","barber","clinic","baths","hospital","forum","senate","garden","oracle"].map(t)),p("h4",{},"Entertainment"),p("p",{},`A home's entertainment is the points of every venue whose entertainer passed by lately (Theatrum ${_e.theater}, Amphitheatrum ${_e.amphitheater} or ${_e.amphitheater+ht.amphitheater} with plays and gladiators, Arena ${_e.colosseum} or ${_e.colosseum+ht.colosseum} with gladiators and beasts, the Circus's charioteer ${_e.hippodrome}), plus a share for every home of how well the venues' seats cover the city: up to ${Io}, or ${yt} with races at the Circus, which seats the whole city. Venues only send entertainers while shows are booked. The Circus (Hippodrome: one per city, 15 \xD7 5 tiles; click to place it by its middle) gets its races from a Factio (Chariot Stable): each team books 32 days. Its charioteer drives twice as fast and twice as far as other entertainers, and prosperity rises a little while races run. The top two homes need ${q[je-1].ent} and ${q[je].ent}: the Imperial Palatium needs the Circus.`),p("h4",{},"Gods"),p("p",{},`Five gods watch over the city, each with a temple of its own, small or large. Each wants about one staffed temple per ${g.PEOPLE_PER_TEMPLE} of its share of citizens, and a large temple counts as two (its priest walks the same rounds as a small temple's); towns under 800 people are left alone. A content god (mood ${g.GOD_BLESS_MOOD} or more, which takes festivals or oracles) blesses the city; a neglected one (${g.GOD_WRATH_MOOD} or less) strikes. A god that has struck stays angered until its mood is back above ${g.GOD_CALM_MOOD}, and Mercury and Venus strike harder if angered again (not in the first two campaign missions). The Religion advisor shows each god's mood.`),p("table",{class:"tbl"},fe.map(o=>p("tr",{},p("td",{},p("b",{style:{color:te[o].color}},te[o].name)),p("td",{style:{fontSize:"12.5px"}},`${te[o].domain}. Blessing: ${te[o].blessing} Wrath: ${te[o].wrath}`)))),p("h4",{},"Crime"),p("p",{},`Every household has a mood of its own: the city's mood, lower for a hungry home, a squalid street or the poor living among villas, a little higher for plenty of food or no tax collector at the door. Click a home to see it (Mood and order). Once the city has ${g.CRIME_MIN_POP} people, an unhappy home can breed trouble:`),p("ul",{},p("li",{},p("b",{},"Protesters "),`(mood under ${g.CRIME_MOOD}) stand in the street for a few days. Harmless: they cost no peace, except on Insane, where every ${ue.insane.protestPeaceEvery}th costs ${g.PROTEST_PEACE}.`),p("li",{},p("b",{},"Thieves "),`(under ${g.THIEF_MOOD}) sneak to the Forum or the Curia (Senate House) and steal part of this year's taxes, at most ${g.THEFT_CAP} Dn and never more than the treasury holds, or empty half a market stall. Each costs peace (${rw(g.THIEF_PEACE)}), and on all but Easy the month's peace gain.`),p("li",{},p("b",{},"Riots "),`(${g.RIOT_MOOD} or less, while the city's mood is under ${g.RIOT_CITY_MOOD}): the rioters burn their own home and march on the finest building nearby, setting fire to what they pass. Peace falls (${rw(g.RIOT_PEACE)}), but the anger is spent: every home's mood rises by ${g.RIOT_MOOD_BOOST}.`)),p("p",{},`The angrier the city, the likelier trouble is. A prefect passing a home halves the chance for ${g.POLICE_DAYS} days, and prefects and soldiers catch the criminals they meet; prefects on patrol chase thieves and rioters within ${g.HUNT_RANGE} tiles. The Crime overlay shows which homes are close to trouble and why. The first two campaign missions have no crime.`),p("h4",{},"Health and disease"),p("p",{},`Every home has a health score out of 100: its level (up to ${g.HEALTH_LEVEL_MAX}), health care (a medicus ${g.HEALTH_CARE_MEDICUS}, a hospital within ${g.HOSPITAL_RADIUS} tiles ${g.HEALTH_CARE_HOSPITAL}, both ${g.HEALTH_CARE_BOTH}), baths ${g.HEALTH_BATHS}, a barber ${g.HEALTH_BARBER}, fountain water ${g.HEALTH_FOUNTAIN} (not a well) and ${g.HEALTH_PER_FOOD} for each kind of food; a home whose people eat and that has no food at all scores at most ${g.HEALTH_HUNGRY_MAX} (tents forage). Click a home to see it (Health).`),p("p",{},`Once the city has ${g.DISEASE_MIN_POP} people, crowded homes with a poor score build up disease risk, as buildings build up fire risk, and a physician passing by clears it. A home that falls sick loses about a fifth of its people (a tenth near a hospital), cannot move up or take in settlers for ${g.SICK_DAYS} days, and may pass the sickness to the homes touching it. A staffed Medicus (Physician) sends a physician to cure it, as an Excubitorium (Prefecture) sends prefects to a fire. The Disease overlay shows which homes are at risk and which are sick. The first two campaign missions have no disease.`),p("p",{},`The Health, Education and Entertainment advisors (F2) show, for each kind of building, how many there are and how many have workers, the people its walkers reached (a hospital: the homes within ${g.HOSPITAL_RADIUS} tiles), and how many of the people whose homes need it to keep or reach their level have it, in words from None to Full. A building serves every home its walker passes, however many; venues are the exception, with seats that set the entertainment every home gets. Each advisor gives one line of advice on what holds homes back most; click a building's name to go to one. The Health advisor also shows city health, which moves ${g.HEALTH_STEP} points a month toward the homes' average score, and the year's outbreaks; the Overview has city health and crime at a glance.`),p("h4",{},"Ratings"),p("p",{},`Culture comes from religion, education and entertainment coverage. Prosperity from housing quality, profit and employment. Peace grows while citizens are content, and falls in any month enemies are in the province; Rome proclaims no victory until they are gone. Favor is the Emperor's opinion: pay tribute, answer his requests and his calls for troops, avoid debt. Favor 0 does not end the game, but at ${g.LEGION_FAVOR} or less Caesar sends his legions against you (see Military). In debt nothing can be built; Rome lends money (Finance advisor), repaid monthly with interest.`),p("h4",{},"The governor: rank, salary, savings"),p("p",{},`You hold a rank, from ${ve[0].name} to ${ve[hn].name}: each step of the campaign is played one rank higher, both of its provinces alike (${ve[0].name} in the first, ${ve[ss.at(-1).rank].name} in the last), and the sandbox lets you pick one. Your rank sets the salary Rome expects you to draw: ${ve.map(o=>`${o.name} ${o.salary}`).join(", ")} Dn a month. In the Imperial advisor you can draw any of these rates. The salary is paid at each month's end from the treasury into your personal savings, but never when the treasury cannot cover it. At New Year Rome looks at what you drew over the year: more than your rank's pay costs a point of favor for every rank above it, less, by your own choice, earns one point. The year you win a mission is never weighed: Rome takes back from your savings what you drew above your rank that year.`),p("p",{},`Your savings are your own and go with you from mission to mission (to both provinces of the next step where it has two). Spend them on gifts to the Emperor (Imperial advisor): a modest, generous or lavish gift costs ${Nt.map(o=>`1/${o.share} of your savings plus ${o.base} Dn`).join(", ")}, and pleases him by ${Nt.map(o=>`+${o.favor[0]}`).join(", ")} favor; each further gift within a year of your last pleases him less, and he counts afresh 12 months after the last. Or give them to the city: a donation goes into the treasury and is not counted as profit. Festivals are paid from the treasury.`),p("p",{},`Your residence: a Praetorium (Governor's House: ${H.governor_house.cost} Dn, 3\xD73), Praetorium Maius (Villa: ${H.governor_villa.cost} Dn, 4\xD74) or Regia (Palace: ${H.governor_palace.cost} Dn, 5\xD75), under Government & Decor. It is kept by servants (${H.governor_house.workers}, ${H.governor_villa.workers} and ${H.governor_palace.workers} workers), so it needs a road like any building with workers, and makes the land around it very desirable as far as it is staffed (+${H.governor_house.des[0]}, +${H.governor_villa.des[0]}, +${H.governor_palace.des[0]} beside it). Only one may stand at a time: demolish it to build a bigger one. Rioters within ${g.RIOT_TARGET_RANGE} tiles go for it before anything else.`)]}case"military":return[p("p",{},`Some provinces are raided by barbarian warbands, and raiders never come before the city has ${qo} people. Warbands grow as your city grows. You are warned three times (the \u26A0 alert in the top bar shows from the first): about ${Ct} months before a raid traders speak of a warband gathering beyond the frontier; about ${qt} months before, scouts report its size and the side it will come from (or that it comes by sea, and where it will land); a month before, a last warning names its side (or its landing) again. A town that falls under ${qo} people by the scouts' report has its raid put off: the warband "drifted away".`),p("p",{},"The Empire map (E) shows the warband closing in: at the frontier while it is only rumoured, then from its side, with its size and the months left. Click it to look at the map edge it will enter by, where your towers and soldiers should wait. Clicking the first two warnings opens the Empire map on it; the last one takes you to the place (unless the ships found no shore)."),p("h4",{},"Recruiting"),ot("Tirocinium (Barracks)","recruit walks by road","Fort"),p("p",{},"A staffed Tirocinium trains a recruit every few days and sends him to the emptiest staffed fort: a Castra (Legion Fort), Praesidium (Archer Fort) or Castra Equitum (Cavalry Fort). Each fort holds 8 soldiers. Recruits need equipment at the Tirocinium, delivered by cart from workshops, ranches and warehouses:"),ot("Ferraria (Iron Mine)","Fabrica (Weaponsmith)","Tirocinium","Legionary"),ot("Silva Caedua (Timber Yard) + Ferraria","Officina Sagittaria (Fletcher)","Tirocinium","Archer"),ot("Equaria (Horse Ranch, meadow)","Tirocinium","Cavalryman"),p("p",{},"An Equaria starts with 2 breeding mares and gains one about every 30 staffed days, up to 8. Foals come faster as the herd grows, so build ranches early. Horses can also be imported by trade."),p("h4",{},"Soldiers and ships"),p("table",{class:"tbl"},Object.values(F).map(t=>p("tr",{},p("td",{},p("b",{style:{color:t.color}},t.name)),p("td",{style:{fontSize:"12.5px"}},`${t.desc}${t.upkeep?` Pay ${t.upkeep} Dn/month.`:""}`)))),p("h4",{},"Orders"),p("p",{},"A garrison at rest holds its fort: its men fight only what comes to them (a legionary or cavalryman steps out to strike an enemy within about 2 tiles of the ranks and steps back; an archer shoots whatever comes in range of his post; anyone answers an enemy striking at him). To fight in the field, click a fort and press Deploy, then click the map: the soldiers march there, hold that spot and fight raiders around it (about 1.5x their sight), at a gate, a bridge, the edge of town or on top of a warband. Recall brings them home."),p("h4",{},"Training"),ot("Tirocinium","Campus (Military Academy)","Fort"),p("p",{},`A Campus trains soldiers, but only while every one of its ${H.military_academy.workers} workers is in place. Each new recruit marches first to the academy nearest his fort and trains there ${g.ACADEMY_TRAIN_DAYS} days (counted only while it is fully staffed: one short of staff pauses him, for up to ${g.TRAIN_WAIT_MAX_DAYS} days), his place in the fort kept for him, then marches on, trained (the academy demolished meanwhile, he goes on untrained); soldiers already in a fort stay at their posts and are never sent, so a man who joined untrained stays so. A fort's panel shows how many of its men are trained. Trained legionaries standing their ground (at their post, or standing to fight) take a quarter of a missile's damage and +${F.legionary.holdDefense} defense (close order); trained archers and cavalry +${F.archer.trainedDefense} defense. Attack and health never change.`),p("h4",{},"Defenses"),p("p",{},"A Turris (Watchtower) shoots raiders within 8 tiles. A Murus (Wall) must be broken before raiders can pass; drag a wall across a road to build a Porta (Gate) that citizens can use but raiders cannot. Raiders take the cheapest way to your buildings, so a wall with a gap is just a detour."),p("p",{},"Raiders burn or wreck what they reach, and a warband that is not driven off leaves with plunder from your treasury. Kill most of it and the survivors flee; repelling a raid raises Peace and the Emperor's favor."),p("p",{},`Prefects on their rounds fight raiders and Caesar's legionaries who come within ${g.PREFECT_FIGHT_REACH} tiles, standing their ground until the enemy is more than ${g.PREFECT_FIGHT_LEASH} tiles off. A prefect hits about a third as hard as a legionary and usually loses: he slows a warband, he does not stop it. One killed is replaced only after his prefecture's usual delay, so the streets go unwatched for a while (the Military advisor counts prefects lost). His kills count toward the raid like a soldier's. A prefect running to a fire does not stop to fight.`),p("h4",{},"Raids by sea"),p("p",{},`Where a river or the sea reaches the map edge, about ${Math.round(g.SEA_RAID_SHARE*100)}% of raids come by ship (the Sea raids switch, on by default, in Settings and the sandbox setup). Scouts say so ("by sea, from the ..."), and the Empire map shows the warband in a longship. Raider ships sail in from the edge of the water, ${g.RAID_SHIP_CREW} raiders a ship, and put them ashore near the city, about ${g.LANDING_WALK} tiles' walk from the nearest home: from there they fight like any warband. The ships wait offshore and leave when the raid is over; fleeing raiders run back to them.`),p("p",{},`At sea each raider ship throws up to ${g.RAID_SHIP_POTS} fire pots, one every 2 days, at anything within 5 tiles of it: a fishing boat sinks; a building by the shore takes ${g.RAID_SHIP_POT_DAMAGE} damage (more on harder levels) and ${g.RAID_SHIP_FIRE_HEAT} points of fire risk, which a passing prefect clears. A ship sunk before it lands drowns its raiders.`),p("h4",{},"The fleet"),ot("Timber + Iron + Linen","Navalia (Naval Dockyard)","liburnian rows by water","Statio (Naval Station)"),p("p",{},`The Navalia, a naval dockyard on the shore, builds a liburnian from ${Object.entries(g.LIBURNIAN_COST).map(([t,o])=>`${o} ${U[t].name.toLowerCase()}`).join(", ")} in ${g.NAVALIA_BUILD_DAYS} days at full staff. Carts bring the materials while a staffed Statio on its water has an empty berth, and each new ship rows to the emptiest one. A Statio berths a squadron of ${Fe}.`),p("p",{},`A squadron fights raider ships within ${g.STATION_GUARD} tiles of its berths: its marines shoot arrows, and it rams the ships it reaches. Click the station, press Deploy and click the water to send it elsewhere on its river or sea (it then guards ${g.STATION_GUARD_DEPLOYED} tiles around that spot); Recall brings it home. One liburnian beats one raider ship, but several raider ships together can sink it; the Navalia builds another. If a station is lost, its ships go to another station on the same water with an empty berth, and the rest are laid up.`),p("p",{},`The Portus (Training Harbor: Colonia's own, after the harbor Agrippa cut near Naples to train his crews) is the fleet's academy: a training harbor on the shore of the stations' water, working only at full staff. A new liburnian rows to it first and moors there ${g.PORTUS_TRAIN_DAYS} days (only while it is fully staffed) before going to its berth; ships already at their berths stay there. A trained crew rows faster, rams harder (${F.liburnian.trainedRam} to ${F.liburnian.ram}) and is harder to hit.`),p("h4",{},"Caesar's legions"),p("p",{},`If the Emperor's favor falls to ${g.LEGION_FAVOR} or less, Caesar warns you and sends his own legions: they march from Rome for 12 months (the Empire map shows them coming) and enter by the map entrance. Halfway, and again a month before they come, a reminder says what your favor at that moment would make them do. Nothing stops the march, but your favor when they arrive decides what they do: at ${ue.normal.legionHome} or more (on Normal; ${ue.easy.legionHome} on Easy, ${ue.hard.legionHome} on Hard, ${ue.insane.legionHome} on Insane) they march home; from ${ue.normal.legionHalt} (${ue.easy.legionHalt}, ${ue.hard.legionHalt}, ${ue.insane.legionHalt}) they halt where they stand during their first year; below that they attack: your residence first, then the finest homes, then anything, breaking through whatever stands in the way. Each attack is bigger than the last: ${g.LEGION_SIZES.join(", ")} imperial legionaries (
