  border-radius: 6px;
  font-size: 12.5px;
  pointer-events: none;
  box-shadow: var(--shadow);
  border: 1px solid var(--bronze);
}
#tooltip.warn {
  border: 2px solid var(--bad);
  background: color-mix(in srgb, var(--bad) 22%, var(--hud));
  font-weight: 600;
}
#crash {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(15, 10, 8, 0.92);
  color: #f5e9d8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#crash .box { max-width: 720px; width: 100%; background: #2a211a; border: 2px solid #b3261e; border-radius: 10px; padding: 16px; }
#crash pre { max-height: 40vh; overflow: auto; background: #140f0b; padding: 10px; border-radius: 6px; font-size: 12px; user-select: text; -webkit-user-select: text; white-space: pre-wrap; }
.empire-modal { width: min(1180px, 100%); max-height: min(94vh, 100%); }
.empire-body { display: flex; gap: 14px; align-items: flex-start; scrollbar-gutter: stable; }
.empire-main { flex: 1 1 auto; min-width: 0; }
.empire-map-wrap { width: 100%; display: flex; justify-content: center; }
.empire-full { display: block; border-radius: 4px; cursor: pointer; touch-action: manipulation; }
.empire-readout { margin-top: 6px; min-height: 2.6em; font-size: 13px; }
.empire-side { flex: 0 0 300px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.empire-section h4 { margin: 0 0 4px; }
.empire-row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; font-size: 13px; border-radius: 4px; }
.empire-row.link { cursor: pointer; width: 100%; border: none; background: none; text-align: left; }
.empire-row.link:hover, .empire-row.sel { background: var(--panel-3); }
.empire-glyph { flex: none; display: inline-flex; }
.empire-glyph canvas { border-radius: 3px; }
.empire-legend .empire-row { font-size: 12px; color: var(--ink-soft); }
@media (max-width: 760px) {
  :root { --sidebar-w: 0px; --top-h: 42px; }
  #hud-top { right: 0; }
  #sidebar {
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    height: auto;
    max-height: 46vh;
    border-left: none;
    border-top: 3px solid var(--bronze);
  }
  #minimap-wrap { display: none; }
  #categories { grid-template-columns: repeat(7, 1fr); }
  .cat-btn { aspect-ratio: auto; height: 38px; }
  #build-list { max-height: 22vh; }
  #build-list.collapsed { display: none; }
  #tool-info { min-height: 0; max-height: 72px; }
  #info-panel { left: 8px; right: 8px; width: auto; top: calc(var(--top-h) + 6px); max-height: 50vh; }
  #messages { bottom: auto; top: calc(var(--top-h) + 6px); width: calc(100% - 16px); left: 8px; }
  #overlay-legend { display: none; } 
  .hud-title { display: none; }
  .grid2 { grid-template-columns: 1fr; }
  .tabs.advisor-tabs { padding: 4px 6px 0; gap: 0; }
  .advisor-tabs .tab { padding: 5px 5px; font-size: 12.5px; }
  .empire-body { flex-direction: column; align-items: stretch; }
  .empire-side { flex: none; }
  #console { right: 0; }
}
