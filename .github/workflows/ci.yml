# Continuous integration: unit tests, a reproducible build check and the
# browser smoke test, on every push (any branch) and every pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Simulation tests
        run: npm test

      - name: Build and verify dist/colonia.html is up to date
        run: |
          npm run build
          if ! git diff --quiet -- dist/colonia.html; then
            echo "::error file=dist/colonia.html::dist/colonia.html is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/colonia.html
            exit 1
          fi

      - name: Install Playwright + Chromium (not a project dependency)
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e
