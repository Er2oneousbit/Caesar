#title-gate .gate-hint { margin-top: 12px; font-size: 13px; color: var(--ink-soft); }
@keyframes gate-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes gate-out { from { opacity: var(--gate-from, 1); } to { opacity: 0; } }
@keyframes gate-pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 45%, transparent); } }
@media (prefers-reduced-motion: reduce) {
  #main-menu .menu-card { transition: none; }
  #title-gate { animation: gate-in 0s 0.15s both; } 
  #title-gate.leaving { animation: none; opacity: 0; }
  #title-gate .gate-begin { animation: none; }
}
#debug-hud {
  position: absolute;
  left: 10px;
  top: calc(var(--top-h) + 8px);
  z-index: 30;
  background: rgba(0, 0, 0, 0.72);
  color: #9fef9f;
  font: 12px/1.35 ui-monospace, Consolas, monospace;
  padding: 6px 8px;
  border-radius: 6px;
  pointer-events: none;
  white-space: pre;
}
#console {
  position: absolute;
  left: 0;
  right: var(--sidebar-w);
  top: var(--top-h);
  height: 40%;
  background: rgba(10, 10, 10, 0.92);
  color: #d8f5d8;
  font: 13px/1.4 ui-monospace, Consolas, monospace;
  z-index: 45;
  display: flex;
  flex-direction: column;
  border-bottom: 2px solid var(--bronze);
}
#console .out { flex: 1; overflow-y: auto; padding: 8px 10px; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
#console input { border: none; border-top: 1px solid #333; background: #111; color: #fff; padding: 8px 10px; outline: none; font: inherit; }
#overlay-legend {
  position: absolute;
  right: calc(var(--sidebar-w) + 10px);
  bottom: 10px;
  z-index: 20;
  background: var(--panel);
  border: 1px solid var(--bronze);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 6px 10px;
  font-size: 12px;
  line-height: 1.5;
  pointer-events: none;
}
#overlay-legend .legend-row { display: flex; align-items: center; gap: 6px; }
#overlay-legend .legend-row i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.trend-head { display: flex; justify-content: space-between; font-size: 12.5px; }
.trend-range { font-size: 11px; }
canvas.trend { display: block; margin: 2px 0; }
#tooltip {
  position: fixed;
  z-index: 60;
  max-width: 280px;
  background: var(--hud);
  color: var(--hud-ink);
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 12.5px;
  pointer-events: none;
  box-shadow: var(--shadow);
  border: 1px solid var(--bronze);
}
#tooltip.warn {
  border: 2px solid var(--bad);
  background: color-mix(in srgb, var(--bad) 22%, var(--hud));
  font-weight: 600;
}
#crash {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(15, 10, 8, 0.92);
  color: #f5e9d8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#crash .box { max-width: 720px; width: 100%; background: #2a211a; border: 2px solid #b3261e; border-radius: 10px; padding: 16px; }
#crash pre { max-height: 40vh; overflow: auto; background: #140f0b; padding: 10px; border-radius: 6px; font-size: 12px; user-select: text; -webkit-user-select: text; white-space: pre-wrap; }
.empire-modal { width: min(1180px, 100%); max-height: min(94vh, 100%); }
.empire-body { display: flex; gap: 14px; align-items: flex-start; scrollbar-gutter: stable; }
.empire-main { flex: 1 1 auto; min-width: 0; }
.empire-map-wrap { width: 100%; display: flex; justify-content: center; }
.empire-full { display: block; border-radius: 4px; cursor: pointer; touch-action: manipulation; }
.empire-readout { margin-top: 6px; min-height: 2.6em; font-size: 13px; }
.empire-side { flex: 0 0 300px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.empire-section h4 { margin: 0 0 4px; }
.empire-row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; font-size: 13px; border-radius: 4px; }
.empire-row.link { cursor: pointer; width: 100%; border: none; background: none; text-align: left; }
.empire-row.link:hover, .empire-row.sel { background: var(--panel-3); }
.empire-glyph { flex: none; display: inline-flex; }
.empire-glyph canvas { border-radius: 3px; }
.empire-legend .empire-row { font-size: 12px; color: var(--ink-soft); }
@media (max-width: 760px) {
  :root { --sidebar-w: 0px; --top-h: 42px; }
  #hud-top { right: 0; }
  #sidebar {
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    height: auto;
    max-height: 46vh;
    border-left: none;
    border-top: 3px solid var(--bronze);
  }
  #minimap-wrap { display: none; }
  #categories { grid-template-columns: repeat(7, 1fr); }
  .cat-btn { aspect-ratio: auto; height: 38px; }
  #build-list { max-height: 22vh; }
  #build-list.collapsed { display: none; }
  #tool-info { height: auto; min-height: 0; max-height: 72px; }
  #info-panel { left: 8px; right: 8px; width: auto; top: calc(var(--top-h) + 6px); max-height: 50vh; }
  #messages { bottom: auto; top: calc(var(--top-h) + 6px); width: calc(100% - 16px); left: 8px; }
  #overlay-legend { display: none; } 
  .hud-title { display: none; }
  .grid2 { grid-template-columns: 1fr; }
  .tabs.advisor-tabs { padding: 4px 6px 0; gap: 0; }
  .advisor-tabs .tab { padding: 5px 5px; font-size: 12.5px; }
  .empire-body { flex-direction: column; align-items: stretch; }
  .empire-side { flex: none; }
  #console { right: 0; }
}

t) sends vendors to sell food to homes.","An Excubitorium (Prefecture) and a Collegium Fabrum (Engineer's Post) keep fires and collapses away. Put them near your homes.","The Forum sends tax collectors. Homes they have not visited pay nothing!",`Culture here comes from the temples: every home a priest visits counts. Peace grows a point a month while the city is content (a mood of ${g.PEACE_MOOD} or more): fed, housed, at work and not overtaxed.`,"Click any building for details. Homes tell you exactly what they need to grow.",`This land gives little work: a town of about 300 people fills its jobs. More homes than that only add idle hands, and above ${g.UNEMPLOYMENT_MOOD_FREE*100}% unemployment the mood falls and peace stops growing. The Labor advisor shows how many are out of work.`]},{id:"c2",step:2,name:"Aquae Clarae",title:"Clear Waters",intro:"A lakeside town needs clean water and a little culture. Build reservoirs by the lakes, run aqueducts, and give citizens fountains, schools and a stage.",map:{size:96,type:"lakes",seed:"aquae-clarae"},site:"volsinii",funds:7e3,startYear:-270,goals:{population:450,culture:35,prosperity:20,peace:45,favor:0},paceYears:2.1,rank:1,unlocks:kp,partners:[],requests:!1,crime:!1,disease:!1,majorWrath:!1,hints:["A Castellum Aquae (Reservoir) placed next to water fills up. A Lacus (Fountain) inside its piped area (10 tiles) supplies homes within 4 tiles.","An Aquaeductus (Aqueduct) connects a full reservoir to other reservoirs farther inland.","Cottages need a fountain; above them homes want entertainment, then a school. A Theatrum (Theater) needs actors: build a Grex (Actor Troupe) nearby.","Prosperity grows with better homes, a profit, work for everyone and fair wages.","Work is still scarce here: about 450 people fill the jobs a sensible town has. Build homes for the people your buildings can employ, not more."]},{id:"c3",step:3,track:"peaceful",name:"Figlina",title:"Clay and Commerce",intro:"The plains of Figlina are rich in clay. Build an industry, fill warehouses and open your first trade route. Prosperity is now expected of you.",map:{size:112,type:"plains",seed:"figlina"},site:"figline",funds:7e3,startYear:-255,goals:{population:950,culture:45,prosperity:30,peace:50,favor:0},paceYears:2.5,rank:2,unlocks:bh,partners:["tarraco","aquileia"],requests:!0,market:{clay:.85,timber:1.15},hints:["A Cretifodina (Clay Pit) must be near water. A Figlina (Potter) turns clay into pottery, which Merchant Houses and every home above them need, with Balneae (Baths) nearby.","A Horreum (Warehouse) stores goods. Caravans only trade with warehouses.","Open trade routes in the Trade advisor, then mark goods for import or export.","Trade is work: what your partners buy keeps farms, clay pits and potters staffed. Let the town grow as its jobs do.","A Domus wants more shows than a theater gives: add an Amphitheatrum (Amphitheater), with gladiators from a Ludus Gladiatorius (Gladiator School), and actors too for its best shows."]},{id:"c3m",step:3,track:"military",name:"Firmum",title:"The Picene Frontier",intro:"Rome planted the Latin colony of Firmum on a hilltop above the Picene country in 264 BC, once the Picenes were beaten, and the tribes in the valleys have not forgotten the war. Dig iron from the hills, arm a legion and hold the town: whoever holds Firmum holds the road along the Adriatic.",map:{size:112,type:"lakes",seed:"firmum-picenum"},site:"firmum",funds:7e3,startYear:-255,goals:{population:1100,culture:35,prosperity:20,peace:48,favor:0},paceYears:2.3,rank:2,unlocks:Y3,partners:["aquileia","capua"],requests:!0,market:{iron:.85,olives:.9,wine:1.15},military:{first:24,interval:[16,24],base:3},distantBattles:[{year:2,city:"ariminum",enemy:12}],hints:["Raiders come down from the hills within two years. A Ferraria (Iron Mine) by the rocks and a Fabrica (Weaponsmith) arm the legionaries a Tirocinium (Barracks) trains for a Castra (Legion Fort).","Word of a raid comes about six months before it and scouts report its size and road three months before, and the Empire map shows the warband and the edge it will come in by. Build Turres (Towers) and a Murus (Wall) across that way in.","A Campus (Military Academy) trains your legionaries to fight harder.","Capua buys iron: what the mine digs beyond the weaponsmith's needs is trade, and work.","A Domus wants more shows than a theater gives: add an Amphitheatrum (Amphitheater), with gladiators from a Ludus Gladiatorius (Gladiator School)."]},{id:"c4",step:4,track:"military",name:"Pons Aelius",title:"The River Crossing",intro:"A great river divides this province. Bridge it, harvest its forests and olive groves, and entertain a growing people with gladiatorial games.",map:{size:128,type:"river",seed:"pons-aelius"},site:"etruria",funds:8e3,startYear:-240,goals:{population:2700,culture:50,prosperity:40,peace:55,favor:0},paceYears:2.9,rank:3,unlocks:wp,partners:["tarraco","massilia","lugdunum"],requests:!0,market:{timber:.85,olives:.9,iron:1.1},military:{first:60,interval:[30,40],base:4},distantBattles:[{year:3,city:"placentia",enemy:16}],hints:["A Pons (Bridge) must start and end on land and run straight across water.","Massilia trades by sea: build an Emporium (Trade Dock) on the river bank. Tarraco and Lugdunum send caravans along the Imperial road.","Apartment Houses need furniture (an Officina Lignaria, the carpenter, from timber); Tenements, the first big homes, also need oil, a barber, and both a school and a library.","Insulae also need clothing: a Linarium (Flax Field) on meadow, a Textrinum (Linen Weaver) and a Taberna Vestiaria (Clothing Maker), or linen bought from Tarraco for the Taberna Vestiaria.","Raiders roam these hills. A Tirocinium (Barracks) trains soldiers for your forts: legionaries need weapons (Fabrica, the weaponsmith), archers need arrows (Officina Sagittaria, the fletcher, from timber and iron)."]},{id:"c4p",step:4,track:"peaceful",name:"Paestum",title:"City of Temples",intro:"The Greeks of Poseidonia raised great temples on this shore long before Rome made their city the Latin colony of Paestum in 273 BC. Keep the gods content, fill the harbor with ships from Massilia and Corinthus, and make Paestum a city the Greeks would envy. No enemy threatens this shore: Rome will judge you by what you build.",map:{size:128,type:"coast",seed:"paestum"},site:"paestum",funds:8e3,startYear:-240,goals:{population:2700,culture:60,prosperity:50,peace:65,favor:40},paceYears:3.75,rank:3,unlocks:On(wp),partners:["capua","massilia","corinthus"],requests:!0,market:{wine:.9,marble:1.2},hints:["No raiders come to Paestum, and you may build no forts. Rome watches your favor instead: meet Caesar's requests and send gifts, for if his favor runs out his legions come, and there is no army here to meet them.","Culture is the measure of this city: a Templum (Grand Temple) counts as two temples to its god, and schools, a Bibliotheca (Library) and shows add the rest.","Corinthus sells marble and oil by sea and buys wheat, iron and clothing. Build an Emporium (Trade Dock) on the shore.","Apartment Houses need furniture (an Officina Lignaria, the carpenter, from timber); Tenements also need oil, a barber, and both a school and a library; Insulae need clothing too."]},{id:"c5",step:5,track:"military",name:"Portus Mercatorum",title:"Merchant Shore",intro:"A coastal province with iron in its hills and vines on its slopes. Grow a wealthy city worthy of villas, and keep the Emperor happy.",map:{size:128,type:"coast",seed:"portus-mercatorum"},site:"populonia",funds:9e3,startYear:-225,goals:{population:4600,culture:60,prosperity:50,peace:60,favor:55},paceYears:5.1,rank:4,unlocks:na,partners:["massilia","lugdunum","carthago","corinthus","cirta","alexandria"],requests:!0,market:{iron:.85,wine:.9,marble:1.15},military:{first:48,interval:[22,32],base:6},distantBattles:[{year:3,city:"saguntum",enemy:28}],hints:["Villas need wine, two kinds of food and two gods. Patricians do not work, but pay handsome taxes and lift prosperity.","From the Insula up homes need clothing. Alexandria's ships bring Egyptian linen for a Taberna Vestiaria (Clothing Maker), and Corinthus buys clothing.","The Emperor's favor drifts back toward 50: his requests, the yearly tribute and gifts raise it.","Cavalry needs horses. Breed them at an Equaria (Horse Ranch) on meadow, where the herd grows over time, or import them from Cirta by sea."]},{id:"c5p",step:5,track:"peaceful",name:"Beneventum",title:"The Market on the Appian Way",intro:'The Samnite town of Maleventum became the Latin colony of Beneventum, the "good outcome", in 268 BC, and the Appian Way runs through it from Capua. Every caravan between Capua and the Adriatic passes here: build a market town worthy of the road, with rich homes, full warehouses and busy streets. The Samnite wars are over; the Senate expects prosperity, not victories.',map:{size:128,type:"river",seed:"beneventum"},site:"beneventum",funds:9e3,startYear:-225,goals:{population:3e3,culture:65,prosperity:60,peace:70,favor:65},paceYears:4.2,rank:4,unlocks:On(na),partners:["capua","tarraco","aquileia","lugdunum"],requests:!0,market:{meat:.85,timber:.9,oil:1.15},hints:["Beneventum trades only by land: four caravan routes meet here. Open them in the Trade advisor and let warehouses near the Imperial road do the business.","There is no army here and no raiders to fear, but Caesar's favor must stay high: his requests, the yearly tribute and gifts all count.","Villas need wine, two kinds of food and two gods. Patricians do not work, but pay handsome taxes and lift prosperity."]},{id:"c6",step:6,track:"military",name:"Oasis Aurea",title:"Sands of Gold",intro:"Water is life in the desert. Only the land around the oases can feed your people. Plan every aqueduct carefully.",map:{size:128,type:"desert",seed:"oasis-aurea"},site:"luceria",funds:1e4,startYear:-210,goals:{population:3500,culture:60,prosperity:55,peace:70,favor:60},paceYears:4.2,rank:5,unlocks:U3,partners:["capua","aquileia","lugdunum","tarraco"],requests:!0,market:{olives:.9,wheat:1.15,vegetables:1.15,timber:1.25},military:{first:42,interval:[20,30],base:6},distantBattles:[{year:4,city:"ariminum",enemy:32}],hints:["No ship can reach the desert, but caravans can: import wheat from Capua if the oases cannot feed everyone.","Desert raiders ride fast: towers and cavalry help."]},{id:"c6p",step:6,track:"peaceful",name:"Cosa",title:"The Loyal Colony",intro:"Cosa, a Latin colony of 273 BC, stands on a hill above the Etruscan coast and its lagoon. Hannibal has been in Italy for eight years, and the colonies are tired of sending men and money: next year twelve of them will refuse, and Cosa will be among the eighteen that keep faith. Plant vines, send wine to Gaul and Greece from the lagoon harbor, and give Rome a colony it can count on. No enemy reaches this coast: Rome will judge you by what you build.",map:{size:144,type:"lakes",seed:"cosa-portus"},site:"cosa",funds:1e4,startYear:-210,goals:{population:5600,culture:70,prosperity:65,peace:75,favor:70},paceYears:6.5,rank:5,unlocks:On(na),partners:["lugdunum","capua","massilia","corinthus","alexandria"],requests:!0,market:{wine:.9,pottery:.9,iron:1.1},demand:{corinthus:{wine:2500},alexandria:{wine:1500},lugdunum:{wine:1500}},demandChanges:[{year:3,partner:"corinthus",good:"wine",to:4e3}],hints:["Wine is Cosa's trade: a Vinea (Vineyard) on meadow and a Cella Vinaria (Winery). Corinthus, Alexandria and the Gauls of Lugdunum buy it, and within a few years Corinthus will want more.","The lagoon reaches the sea: an Emporium (Trade Dock) on its shore receives the ships of Massilia, Corinthus and Alexandria.","No raiders come to Cosa, and you may build no forts. Rome watches your favor instead: meet Caesar's requests and send gifts, for if his favor runs out his legions come.","Villas need wine, two kinds of food and two gods. Patricians do not work, but pay handsome taxes and lift prosperity: give them a quarter of their own, away from the workshops."]},{id:"c7",step:7,track:"military",name:"Urbs Magna",title:"The Great City",intro:"Your greatest charge yet: build a city to rival Rome itself.",map:{size:160,type:"lakes",seed:"urbs-magna"},site:"etruria",funds:12e3,startYear:-190,goals:{population:5800,culture:75,prosperity:70,peace:75,favor:65},paceYears:6.8,rank:6,unlocks:"all",partners:gh,requests:!0,market:{clay:.9,wheat:1.1,marble:1.15},military:{first:36,interval:[14,22],base:8},distantBattles:[{year:3,city:"messana",enemy:40},{year:9,city:"placentia",enemy:52}],hints:["Palatia need four gods, a Medicus (Physician) and a Valetudinarium (Hospital), wine from two sources (a staffed winery and an import route) and plenty of shows.","A Curia (Senate House) adds to culture and prosperity. Expect regular raids: walls with gates, towers and a mixed army keep the capital safe.","The Circus (Hippodrome, one per city, 15 x 5 tiles) races chariots from a Factio (Chariot Stable): its charioteers bring 30 entertainment to the homes they pass, and every home gains a little more."]},{id:"c7p",step:7,track:"peaceful",name:"Copia",title:"Plenty",intro:"In 193 BC Rome planted a Latin colony on the plain where Greek Thurii stood, beside the ruins of Sybaris, and named it Copia: plenty. The richest farmland of the south is yours, and Greece and Hispania are hungry. Feed your city and theirs: here the fields are the work. No enemy threatens the plain; Rome will judge you by culture, prosperity and the Emperor's favor.",map:{size:160,type:"river",seed:"copia"},site:"copia",funds:12e3,startYear:-190,goals:{population:6e3,culture:77,prosperity:73,peace:78,favor:70},paceYears:7.1,rank:6,unlocks:On(Es),partners:["tarraco","lugdunum","aquileia","capua","massilia","corinthus"],requests:!0,market:{wheat:.9,vegetables:.9,timber:1.15},demand:{corinthus:{wheat:4e3},tarraco:{wheat:2500},massilia:{vegetables:2500},lugdunum:{fruit:1500},aquileia:{meat:1500}},demandChanges:[{year:4,partner:"tarraco",good:"wheat",to:4e3}],hints:["Corinthus and Tarraco buy wheat by the shipload and the caravan, Massilia vegetables, Lugdunum fruit and Aquileia meat: Copia's people work in the fields. Within a few years Tarraco will want more.","Traders buy only from warehouses, and a warehouse refuses food until told: set a Horreum (Warehouse) by the fields to Accept the foods you sell. Farm carts fill the granaries first, so once the city is fed set the granaries near those farms to Refuse them.","The Circus (Hippodrome, one per city) comes with this province: its charioteers bring entertainment to every home they pass, and the Imperial Palatium needs its races.","No raiders come to Copia, and you may build no forts. Keep Caesar's favor high with his requests and gifts, for if it runs out his legions come."]},{id:"c8m",step:8,track:"military",name:"Mutina",title:"The Ligurian Hills",intro:"Mutina, a citizen colony of 183 BC, guards the Via Aemilia where the plain of the Po meets the Apennines. In 177 BC the Ligurians came down from the hills and took it, and the consul Gaius Claudius had to win it back. Rebuild it to last: a city of the plain, fed by four caravan roads, with walls and forts for the next war band from the hills.",map:{size:176,type:"plains",seed:"mutina"},site:"mutina",funds:14e3,startYear:-177,goals:{population:6e3,culture:75,prosperity:70,peace:76,favor:66},paceYears:7.1,rank:7,unlocks:x3,partners:["aquileia","capua","lugdunum","tarraco"],requests:!0,market:{wheat:.9,pottery:.9,iron:1.15},demand:{lugdunum:{oil:1500,wine:2500},capua:{furniture:2500,clothing:1500,pottery:1500},aquileia:{meat:1500},tarraco:{pottery:1500}},demandChanges:[{year:5,partner:"capua",good:"furniture",to:4e3}],military:{first:36,interval:[14,20],base:10},distantBattles:[{year:3,city:"placentia",enemy:40},{year:7,city:"ariminum",enemy:48}],hints:["The plain has few ponds: plan reservoirs and aqueducts before the homes need fountains.","Four caravan roads meet at Mutina and no ship comes: warehouses by the Imperial road do all the trade. A route that buys more than its caravans can carry sends them more often.","War bands come down from the hills within three years, every one by land: towers, walls with gates across the roads in, and a mixed army.","Caesar will call for troops for Placentia and Ariminum: keep forts ready for Empire service."]},{id:"c8p",step:8,track:"peaceful",name:"Luna",title:"The White Mountains",intro:"Luna, a citizen colony of 177 BC at the mouth of the Macra, stands on land taken from the Ligurians, under mountains of white stone. Quarry the marble, fell the hill forests and ship both from the harbor: Carthago and Rhodus are building, and they pay well. No enemy reaches this shore; Rome will judge you by culture, prosperity and the Emperor's favor.",map:{size:176,type:"coast",seed:"luna"},site:"luna",funds:14e3,startYear:-177,goals:{population:7e3,culture:78,prosperity:75,peace:80,favor:75},paceYears:8.5,rank:7,unlocks:On(Es),partners:["tarraco","aquileia","massilia","carthago","corinthus","alexandria","rhodus"],requests:!0,market:{marble:.85,timber:.9,wheat:1.15},demand:{carthago:{marble:2500,timber:1500},massilia:{furniture:1500},alexandria:{furniture:1500}},demandChanges:[{year:3,partner:"carthago",good:"marble",to:4e3},{year:6,partner:"rhodus",good:"timber",to:2500}],hints:["A Lapicidina (Marble Quarry) cuts the white stone next to rock. Carthago buys it, and within a few years wants 4,000 a year: six or seven quarries' worth.","Timber from a Silva Caedua (Timber Yard) sells to Carthago and Rhodus, and an Officina Lignaria (Carpenter) turns it into furniture for Massilia and Alexandria.","Rhodus, the trading republic of the east, opens to you: its ships bring wine and buy wheat, timber, iron and weapons.","No raiders come to Luna, and you may build no forts. Keep Caesar's favor high with his requests and gifts, for if it runs out his legions come."]},{id:"c9m",step:9,track:"military",name:"Corduba",title:"Viriathus",intro:"Corduba, founded by Marcus Claudius Marcellus on the Baetis, is the chief town of Further Spain. The Lusitanians have raided the valley since 155 BC, and their war is far from over: from 147 a shepherd called Viriathus will beat army after army sent against him. Make weapons for the war, sell them down the river, hold the town against the raiders from the hills, and answer Caesar when Italica calls.",map:{size:192,type:"river",seed:"corduba"},site:"corduba",funds:16e3,startYear:-150,goals:{population:8e3,culture:76,prosperity:71,peace:77,favor:68},paceYears:9.9,rank:8,unlocks:"all",partners:["tarraco","lugdunum","carthago","cirta","alexandria","gades","rhodus"],requests:!0,market:{iron:.85,olives:.9,weapons:1.15},demand:{carthago:{weapons:2500,marble:1500},alexandria:{weapons:1500},cirta:{weapons:1500}},demandChanges:[{year:4,partner:"carthago",good:"weapons",to:4e3}],military:{first:36,interval:[12,18],base:12},seaRaids:!1,distantBattles:[{year:3,city:"italica",enemy:48},{year:8,city:"italica",enemy:60}],hints:["Weapons are Corduba's trade: a Ferraria (Iron Mine) by the rocks and a Fabrica (Weaponsmith). Carthago, Alexandria and Cirta buy them, Gades sells iron, and within a few years Carthago wants 4,000 a year.","The Lusitanians come over the hills, never by water: towers and walls with gates across the roads in, and a mixed army.","Twice Caesar will call for troops to save Italica, down the Baetis from Corduba: about three months by water. Soldiers sail, and Stationes (Naval Stations) can send their squadrons too.","Gades, beyond the Pillars of Hercules, and Rhodus trade by the river: build Emporia (Trade Docks) on its banks."]},{id:"c9p",step:9,track:"peaceful",name:"Carteia",title:"The Colony of the Strait",intro:"Carteia, on the bay below the great Rock, became in 171 BC the first Latin colony outside Italy: a town for more than four thousand sons of Roman soldiers and Spanish women. Here two seas meet, and the ships of Gades, Delos and the whole sea put in. Make it a market for all of them. No enemy threatens the bay; Rome will judge you by culture, prosperity and the Emperor's favor.",map:{size:192,type:"coast",seed:"carteia"},site:"carteia",funds:16e3,startYear:-150,goals:{population:9500,culture:79,prosperity:76,peace:82,favor:80},paceYears:11.95,rank:8,unlocks:On(Es),partners:["tarraco","massilia","carthago","cirta","corinthus","alexandria","gades","delos"],requests:!0,market:{olives:.9,linen:1.15},demand:{corinthus:{wine:2500,clothing:1500},alexandria:{oil:1500,furniture:1500},cirta:{oil:1500,pottery:1500}},demandChanges:[{year:2,partner:"delos",good:"oil",to:4e3},{year:6,partner:"gades",good:"clothing",to:2500}],hints:["Gades beyond the Pillars and Delos, the free port of the Aegean, open to you. Seven partners come by sea: build two or three Emporia (Trade Docks).","Oil and clothing are in demand: olive groves and a Trapetum (Oil Press), flax fields, a Textrinum (Linen Weaver) and a Taberna Vestiaria (Clothing Maker). Delos soon wants 4,000 oil a year, and Gades more clothing later.","No raiders come to Carteia, and you may build no forts. Favor is asked high here: meet Caesar's requests and send gifts, for if it runs out his legions come."]},{id:"c10m",step:10,track:"military",name:"Narbo Martius",title:"The Cimbri and the Teutones",intro:"Narbo Martius, founded in 118 BC on the Via Domitia, is Rome's first citizen colony beyond the Alps. Whole peoples are on the move in the north: the Cimbri and the Teutones will sweep through Gaul and destroy a Roman army at Arausio before Marius beats them at Aquae Sextiae and Vercellae. Build a great city of many districts on the Atax, its fields, forests and quarries far apart, and hold it against the largest war bands of your career. Win here, and Rome will hail you Caesar.",map:{size:256,type:"river",seed:"narbo-martius",regions:!0},site:"narbo",funds:2e4,startYear:-118,goals:{population:1e4,culture:77,prosperity:72,peace:78,favor:70},paceYears:12.65,rank:9,unlocks:"all",partners:["tarraco","massilia","lugdunum","a rtners (the panel of the Emporium and the Trade advisor say when ships are waiting offshore for a free one). Desert and plains provinces often have no sea access.")),p("p",{},"Horses are the exception: no warehouse keeps them. They live at an Equaria (Horse Ranch), so horses you buy go to a Tirocinium that needs them or to a ranch with room in its stables, and horses you sell are taken from the ranches (by a caravan from those on its warehouse's roads, by ship from staffed ranches near the Emporium). Without a ranch no horses can be imported; the Trade advisor says so."),p("p",{},`Each partner buys and sells at most a set amount of each good a year (its card shows this year's). A mission may set what a partner buys on the original's tiers (${Zh.slice(1,-1).map(t=>t.toLocaleString("en-US")).join(", ")} or ${Zh.at(-1).toLocaleString("en-US")} a year) and change it during the mission: a message names the city and the good when its demand rises, falls or stops. A route busier than its traders can carry (about ${Math.round(Ma("land")/100)*100} a year by caravan, ${Math.round(Ma("sea")/100)*100} by ship) sends them more often.`),p("p",{},`Distance counts (Colonia's own rule; in the original it did not): a trader needs ${Dh} days for every unit of its route on the Empire map, each way, and a quiet route cannot send them more often than one can go home and come back, so a far partner comes less often (a busy one still carries its whole year). The first trader comes when it can have made the trip, at least ${rd} days after you open the route. A route's card says how many days its traders are on the way and how often they come.`),p("p",{},"The Empire map (E, or the compass in the top bar) shows your province where its city stands (each mission has its own place; the sandbox setup lets you choose), Rome and every partner with its route along the roads or the sea lanes. Caravans and ships on their way move along their routes in their city's color; point at one (or tap it) for the days until it arrives. Click a city for what it buys and sells, and to open its route. The game keeps running while it is open."),p("p",{},`Prices are each partner's own (Colonia's own rules; in the original every partner paid one price). Your nearest partner trades at the prices below, your farthest at ${Math.round(g.TRADE_DISTANCE_PREMIUM*100)}% more and the others in between by the length of their route, both ways: a far partner's goods cost more, and a far market pays more for yours. A mission may have a local market of its own, a few goods cheap or dear with every partner (its briefing and the Trade advisor say which). And each New Year every good's price drifts, up to ${Math.round(g.PRICE_DRIFT_MAX*100)}% either way and pulled back toward the base over the years; a message names the biggest moves. A route's card shows each good at that partner's price this year, and the Import and Export choices the range across your partners.`),p("p",{},"Choose whom you trade with (Colonia's own rule): each good on a route's card has a switch beside its price, all on to begin with. Untick it and that partner neither buys nor sells you that good, so you can sell only to the buyers who pay best or buy only from the cheapest seller. The good's Import or Export setting stays the master: a good trades with a partner only while its setting allows it and that partner's switch is on. The Goods table counts the partners left on (to 3 of 5 buyers). Switched-off goods do not make a route busier, and a partner with every good switched off sends no traders until you switch one back on. The trade log names what each visit sold and bought."),p("p",{},"Base prices per 100 units (your nearest partner, before the local market and the year's drift):"),p("table",{class:"tbl"},p("tr",{},p("th",{},"Good"),p("th",{class:"r"},"Import cost"),p("th",{class:"r"},"Export price")),Object.entries(B).map(([,t])=>p("tr",{},p("td",{},`${t.icon} ${t.name}`),p("td",{class:"r num"},t.buy),p("td",{class:"r num"},t.sell))))];case"services":{let t=o=>{let n=H[o];return p("tr",{},p("td",{},p("b",{},n.name),n.en!==n.name?p("div",{class:"muted"},n.en):null),p("td",{style:{fontSize:"12.5px"}},n.desc))};return[p("table",{class:"tbl"},["well","fountain","reservoir","prefecture","engineer_post","market","granary","warehouse","dock","shipyard","wharf","temple_ceres","temple_large_ceres","school","library","academy","theater","actor_troupe","amphitheater","gladiator_school","colosseum","menagerie","hippodrome","chariot_maker","barber","clinic","baths","hospital","forum","senate","garden","oracle"].map(t)),p("h4",{},"Entertainment"),p("p",{},`A home's entertainment is the points of every venue whose entertainer passed by lately (Theatrum ${$e.theater}, Amphitheatrum ${$e.amphitheater} or ${$e.amphitheater+vt.amphitheater} with plays and gladiators, Arena ${$e.colosseum} or ${$e.colosseum+vt.colosseum} with gladiators and beasts, the Circus's charioteer ${$e.hippodrome}), plus a share for every home of how well the venues' seats cover the city: up to ${Vo}, or ${_t} with races at the Circus, which seats the whole city. Venues only send entertainers while shows are booked. The Circus (Hippodrome: one per city, 15 \xD7 5 tiles; click to place it by its middle) gets its races from a Factio (Chariot Stable): each team books 32 days. Its charioteer drives twice as fast and twice as far as other entertainers, and prosperity rises a little while races run. The top two homes need ${V[qe-1].ent} and ${V[qe].ent}: the Imperial Palatium needs the Circus.`),p("h4",{},"Gods"),p("p",{},`Five gods watch over the city, each with a temple of its own, small or large. Each wants about one staffed temple per ${g.PEOPLE_PER_TEMPLE} of its share of citizens, and a large temple counts as two (its priest walks the same rounds as a small temple's); towns under 800 people are left alone. A content god (mood ${g.GOD_BLESS_MOOD} or more, which takes festivals or oracles) blesses the city; a neglected one (${g.GOD_WRATH_MOOD} or less) strikes. A god that has struck stays angered until its mood is back above ${g.GOD_CALM_MOOD}, and Mercury and Venus strike harder if angered again (not in the first two campaign missions). The Religion advisor shows each god's mood.`),p("table",{class:"tbl"},ge.map(o=>p("tr",{},p("td",{},p("b",{style:{color:oe[o].color}},oe[o].name)),p("td",{style:{fontSize:"12.5px"}},`${oe[o].domain}. Blessing: ${oe[o].blessing} Wrath: ${oe[o].wrath}`)))),p("h4",{},"Crime"),p("p",{},`Every household has a mood of its own: the city's mood, lower for a hungry home, a squalid street or the poor living among villas, a little higher for plenty of food or no tax collector at the door. Click a home to see it (Mood and order). Once the city has ${g.CRIME_MIN_POP} people, an unhappy home can breed trouble:`),p("ul",{},p("li",{},p("b",{},"Protesters "),`(mood under ${g.CRIME_MOOD}) stand in the street for a few days. Harmless: they cost no peace, except on Insane, where every ${be.insane.protestPeaceEvery}th costs ${g.PROTEST_PEACE}.`),p("li",{},p("b",{},"Thieves "),`(under ${g.THIEF_MOOD}) sneak to the Forum or the Curia (Senate House) and steal part of this year's taxes, at most ${g.THEFT_CAP} Dn and never more than the treasury holds, or empty half a market stall. Each costs peace (${bv(g.THIEF_PEACE)}), and on all but Easy the month's peace gain.`),p("li",{},p("b",{},"Riots "),`(${g.RIOT_MOOD} or less, while the city's mood is under ${g.RIOT_CITY_MOOD}): the rioters burn their own home and march on the finest building nearby, setting fire to what they pass. Peace falls (${bv(g.RIOT_PEACE)}), but the anger is spent: every home's mood rises by ${g.RIOT_MOOD_BOOST}.`)),p("p",{},`The angrier the city, the likelier trouble is. A prefect passing a home halves the chance for ${g.POLICE_DAYS} days, and prefects and soldiers catch the criminals they meet; prefects on patrol chase thieves and rioters within ${g.HUNT_RANGE} tiles. The Crime overlay shows which homes are close to trouble and why. The first two campaign missions have no crime.`),p("h4",{},"Health and disease"),p("p",{},`Every home has a health score out of 100: its level (up to ${g.HEALTH_LEVEL_MAX}), health care (a medicus ${g.HEALTH_CARE_MEDICUS}, a hospital within ${g.HOSPITAL_RADIUS} tiles ${g.HEALTH_CARE_HOSPITAL}, both ${g.HEALTH_CARE_BOTH}), baths ${g.HEALTH_BATHS}, a barber ${g.HEALTH_BARBER}, fountain water ${g.HEALTH_FOUNTAIN} (not a well) and ${g.HEALTH_PER_FOOD} for each kind of food; a home whose people eat and that has no food at all scores at most ${g.HEALTH_HUNGRY_MAX} (tents forage). Click a home to see it (Health).`),p("p",{},`Once the city has ${g.DISEASE_MIN_POP} people, crowded homes with a poor score build up disease risk, as buildings build up fire risk, and a physician passing by clears it. A home that falls sick loses about a fifth of its people (a tenth near a hospital), cannot move up or take in settlers for ${g.SICK_DAYS} days, and may pass the sickness to the homes touching it. A staffed Medicus (Physician) sends a physician to cure it, as an Excubitorium (Prefecture) sends prefects to a fire. The Disease overlay shows which homes are at risk and which are sick. The first two campaign missions have no disease.`),p("p",{},`The Health, Education and Entertainment advisors (F2) show, for each kind of building, how many there are and how many have workers, the people its walkers reached (a hospital: the homes within ${g.HOSPITAL_RADIUS} tiles), and how many of the people whose homes need it to keep or reach their level have it, in words from None to Full. A building serves every home its walker passes, however many; venues are the exception, with seats that set the entertainment every home gets. Each advisor gives one line of advice on what holds homes back most; click a building's name to go to one. The Health advisor also shows city health, which moves ${g.HEALTH_STEP} points a month toward the homes' average score, and the year's outbreaks; the Overview has city health and crime at a glance.`),p("h4",{},"Ratings"),p("p",{},`Culture comes from religion, education and entertainment coverage. Prosperity from housing quality, profit and employment. Peace grows while citizens are content, and falls in any month enemies are in the province; Rome proclaims no victory until they are gone. Favor is the Emperor's opinion: pay tribute, answer his requests and his calls for troops, avoid debt. Favor 0 does not end the game, but at ${g.LEGION_FAVOR} or less Caesar sends his legions against you (see Military). In debt nothing can be built; Rome lends money (Finance advisor), repaid monthly with interest.`),p("h4",{},"The governor: rank, salary, savings"),p("p",{},`You hold a rank, from ${de[0].name} to ${de[it].name}: each step of the campaign is played one rank higher, both of its provinces alike (${de[0].name} in the first, ${de[_s.at(-1).rank].name} in the last, and a win at the last step makes you ${de[it].name}), and the sandbox lets you pick one. Your rank sets the salary Rome expects you to draw: ${de.map(o=>`${o.name} ${o.salary}`).join(", ")} Dn a month. In the Imperial advisor you can draw any of these rates. The salary is paid at each month's end from the treasury into your personal savings, but never when the treasury cannot cover it. At New Year Rome looks at what you drew over the year: more than your rank's pay costs a point of favor for every rank above it, less, by your own choice, earns one point. The year you win a mission is never weighed: Rome takes back from your savings what you drew above your rank that year.`),p("p",{},`Your savings are your own and go with you from mission to mission (to both provinces of the next step where it has two). Spend them on gifts to the Emperor (Imperial advisor): a modest, generous or lavish gift costs ${Yt.map(o=>`1/${o.share} of your savings plus ${o.base} Dn`).join(", ")}, and pleases him by ${Yt.map(o=>`+${o.favor[0]}`).join(", ")} favor; each further gift within a year of your last pleases him less, and he counts afresh 12 months after the last. Or give them to the city: a donation goes into the treasury and is not counted as profit. Festivals are paid from the treasury.`),p("p",{},`Your residence: a Praetorium (Governor's House: ${H.governor_house.cost} Dn, 3\xD73), Praetorium Maius (Villa: ${H.governor_villa.cost} Dn, 4\xD74) or Regia (Palace: ${H.governor_palace.cost} Dn, 5\xD75), under Government & Decor. It is kept by servants (${H.governor_house.workers}, ${H.governor_villa.workers} and ${H.governor_palace.workers} workers), so it needs a road like any building with workers, and makes the land around it very desirable as far as it is staffed (+${H.governor_house.des[0]}, +${H.governor_villa.des[0]}, +${H.governor_palace.des[0]} beside it). Only one may stand at a time: demolish it to build a bigger one. Rioters within ${g.RIOT_TARGET_RANGE} tiles go for it before anything else.`)]}case"military":return[p("p",{},`Some provinces are raided by barbarian warbands, and raiders never come before the city has ${un} people. Warbands grow as your city grows. You are warned three times (the \u26A0 alert in the top bar shows from the first): about ${Ut} months before a raid traders speak of a warband gathering beyond the frontier; about ${ao} months before, scouts report its size and the side it will come from (or that it comes by sea, and where it will land); a month before, a last warning names its side (or its landing) again. A town that falls under ${un} people by the scouts' report has its raid put off: the warband "drifted away".`),p("p",{},"The Empire map (E) shows the warband closing in: at the frontier while it is only rumoured, then from its side, with its size and the months left. Click it to look at the map edge it will enter by, where your towers and soldiers should wait. Clicking the first two warnings opens the Empire map on it; the last one takes you to the place (unless the ships found no shore)."),p("h4",{},"Recruiting"),lt("Tirocinium (Barracks)","recruit walks by road","Fort"),p("p",{},"A staffed Tirocinium trains a recruit every few days and sends him to the emptiest staffed fort: a Castra (Legion Fort), Praesidium (Archer Fort) or Castra Equitum (Cavalry Fort). Each fort holds 8 soldiers. A deployed fort takes no recruits until it is recalled (one already on his way still joins). Recruits need equipment at the Tirocinium, delivered by cart from workshops, ranches and warehouses (horses come from a ranch, or from the Emporium when imported):"),lt("Ferraria (Iron Mine)","Fabrica (Weaponsmith)","Tirocinium","Legionary"),lt("Silva Caedua (Timber Yard) + Ferraria","Officina Sagittaria (Fletcher)","Tirocinium","Archer"),lt("Equaria (Horse Ranch, meadow)","Tirocinium","Cavalryman"),p("p",{},"An Equaria starts with 2 breeding mares and gains one about every 30 staffed days, up to 8. Foals come faster as the herd grows, so build ranches early. The horses stay in the ranch's stables, 8 at most (a full ranch foals no more), until a Tirocinium needs them for cavalry: then a groom leads them straight there. Warehouses never keep horses. Horses can also be imported by trade, but only into a ranch with room."),p("h4",{},"Soldiers and ships"),p("table",{class:"tbl"},Object.values(G).map(t=>p("tr",{},p("td",{},p("b",{style:{color:t.color}},t.name)),p("td",{style:{fontSize:"12.5px"}},`${t.desc}${t.upkeep?` Pay ${t.upkeep} Dn/month.`:""}`)))),p("h4",{},"Orders"),p("p",{},"A garrison at rest holds its fort: its men fight only what comes to them (a legionary or cavalryman steps out to strike an enemy within about 2 tiles of the ranks and steps back; an archer shoots whatever comes in range of his post; anyone answers an enemy striking at him). To fight in the field, click a fort and press Deploy, then click the map: the soldiers march there, hold that spot and fight raiders around it (about 1.5x their sight), at a gate, a bridge, the edge of town or on top of a warband. Recall brings them home."),p("h4",{},"Training"),lt("Tirocinium","Campus (Military Academy)","Fort"),p("p",{},`A Campus trains soldiers, but only while every one of its ${H.military_academy.workers} workers is in place. Each new recruit marches first to the academy nearest his fort and trains there ${g.ACADEMY_TRAIN_DAYS} days (counted only while it is fully staffed: one short of staff pauses him, for up to ${g.TRAIN_WAIT_MAX_DAYS} days), his place in the fort kept for him, then marches on, trained (the academy demolished meanwhile, he goes on untrained); soldiers already in a fort stay at their posts and are never sent, so a man who joined untrained stays so. A fort's panel shows how many of its men are trained. Trained legionaries standing their ground (at their post, or standing to fight) take a quarter of a missile's damage and +${G.legionary.holdDefense} defense (close order); trained archers and cavalry +${G.archer.trainedDefense} defense. Attack and health never change.`),p("h4",{},"Defenses"),p("p",{},"A Turris (Watchtower) shoots raiders within 8 tiles. A Murus (Wall) must be broken before raiders can pass; drag a wall across a road to build a Porta (Gate) that citizens can use but raiders cannot. Raiders take the cheapest way to your buildings, so a wall with a gap is just a detour."),p("p",{},"Raiders burn or wreck what they reach, and a warband that is not driven off leaves with plunder from your treasury. Kill most of it and the survivors flee; repelling a raid raises Peace and the Emperor's favor."),p("p",{},`Prefects on their rounds fight raiders and Caesar's legionaries who come within ${g.PREFECT_FIGHT_REACH} tiles, standing their ground until the enemy is more than ${g.PREFECT_FIGHT_LEASH} tiles off. A prefect hits about a third as hard as a legionary and usually loses: he slows a warband, he does not stop it. One killed is replaced only after his prefecture's usual delay, so the streets go unwatched for a while (the Military advisor counts prefects lost). His kills count toward the raid like a soldier's. A prefect running to a fire does not stop to fight.`),p("h4",{},"Raids by sea"),p("p",{},`Where a river or the sea reaches the map edge, about ${Math.round(g.SEA_RAID_SHARE*100)}% of raids come by ship (the Sea raids switch, on by default, in Settings and the sandbox setup). Scouts say so ("by sea, from the ..."), and the Empire map shows the warband in a longship. Raider ships sail in from the edge of the water, ${g.RAID_SHIP_CREW} raiders a ship, and put them ashore near the city, about ${g.LANDING_WALK} tiles' walk from the nearest home: from there they fight like any warband. The ships wait offshore and leave when the raid is over; fleeing raiders run back to them.`),p("p",{},`At sea each raider ship throws up to ${g.RAID_SHIP_POTS} fire pots, one every 2 days, at anything within 5 tiles of it: a fishing boat sinks; a building by the shore takes ${g.RAID_SHIP_POT_DAMAGE} damage (more on harder levels) and ${g.RAID_SHIP_FIRE_HEAT} points of fire risk, which a passing prefect clears. A ship sunk before it lands drowns its raiders.`),p("h4",{},"The fleet"),lt("Timber + Iron + Linen","Navalia (Naval Dockyard)","liburnian rows by water","Statio (Naval Station)"),p("p",{},`The Navalia, a naval dockyard on the shore, builds a liburnian from ${Object.entries(g.LIBURNIAN_COST).map(([t,o])=>`${o} ${B[t].name.toLowerCase()}`).join(", ")} in ${g.NAVALIA_BUILD_DAYS} days at full staff. Carts bring the materials while a staffed Statio on its water has an empty berth, and each new ship rows to the emptiest one. A Statio berths a squadron of ${ze}.`),p("p",{},`A squadron fights raider ships within ${g.STATION_GUARD} tiles of its berths: its marines shoot arrows, and it rams the ships it reaches. Click the station, press Deploy and click the water to send it elsewhere on its river or sea (it then guards ${g.STATION_GUARD_DEPLOYED} tiles around that spot); Recall brings it home. One liburnian beats one raider ship, but several raider
